name: Test k8s executor versions
on:
  pull_request:
    paths:
      - redun/executors/k8s.py
      - redun/executors/k8s_utils.py
      - redun/tests/test_k8s.py
      - .github/workflows/test_k8s_versions.yml
      - .uv-version
      - pyproject.toml
      - uv.lock

jobs:
  test-k8s-versions:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Each axis lists what our downstream consumers run today, the next version up, and the
      # newest release, so a break shows up here before a consumer upgrades into it. Shift the
      # values when a consumer's version changes.
      matrix:
        kubernetes: ['kubernetes==31.*', 'kubernetes==32.*', 'kubernetes']
        # '3' is the runner image's own interpreter, not the newest release: uv prefers an
        # installed match over downloading, and forcing a download currently fails because
        # locked dependencies (e.g. pyarrow) have no wheels for the newest CPython yet.
        python: ['3.11', '3.12', '3']
    runs-on: ubuntu-26.04
    steps:
      # v6.1.0 - https://github.com/actions/checkout/releases
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - id: uv-version
        run: echo "version=$(cat .uv-version)" >> $GITHUB_OUTPUT
      # Org policy only allows setup-uv by version tag (astral-sh/setup-uv@v*), not by SHA.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: ${{ steps.uv-version.outputs.version }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --all-extras
      # uv sync installed the repo's pinned kubernetes, which already satisfies the unpinned
      # `kubernetes` spec. Without --upgrade-package, the "latest" cell would silently test the
      # pin. It upgrades only kubernetes (plus any dependency the new version requires), so the
      # other packages stay on the lock.
      - run: uv pip install --upgrade-package kubernetes "${{ matrix.kubernetes }}"
      - run: uv pip show kubernetes
      - run: uv run --no-sync pytest -v redun/tests/test_k8s.py
